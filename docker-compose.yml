version: "3.8"

services:
  recon:
    build: .
    container_name: recon-framework
    ports:
      - "${RECON_PORT:-5000}:5000"
    volumes:
      - recon-output:/app/recon-output
    environment:
      - RECON_OUTPUT_DIR=/app/recon-output
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/modules"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  recon-output:
    driver: local
